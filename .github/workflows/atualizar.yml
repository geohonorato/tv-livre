name: Atualizar Canais

on:
  schedule:
    # Roda todos os dias às 6h e 18h (BRT = 9h e 21h UTC)
    - cron: '0 9,21 * * *'
  workflow_dispatch: # Permite rodar manualmente

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq 2>/dev/null

      - name: Executar varredura
        run: |
          chmod +x scripts/atualizar.sh
          bash scripts/atualizar.sh

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "TV Livre Bot"
          git config user.email "bot@tvlivre.github.io"
          git add canais.json
          git diff --staged --quiet || (git commit -m "🔄 Canais atualizados em $(date +'%d/%m/%Y %H:%M')" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
