<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Livre — IPTV Automática</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    .header {
      background: #131825;
      padding: 15px 20px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.2rem; background: linear-gradient(135deg,#e11d48,#8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header span { color: #64748b; font-size: 0.8rem; }
    .layout { display: flex; gap: 0; height: calc(100vh - 60px); }
    .sidebar {
      width: 260px; background: #131825; overflow-y: auto; flex-shrink: 0;
      border-right: 1px solid #1e293b;
    }
    .sidebar input {
      width: 100%; padding: 10px; border: none; border-bottom: 1px solid #1e293b;
      background: #0a0e1a; color: #fff; font-size: 0.85rem; outline: none;
    }
    .grupo { padding: 8px 12px 4px; font-size: 0.7rem; color: #475569; text-transform: uppercase; letter-spacing: 1px; }
    .canal {
      display: block; width: 100%; padding: 8px 12px; background: none; color: #94a3b8;
      border: none; cursor: pointer; text-align: left; font-size: 0.8rem; transition: 0.2s;
    }
    .canal:hover { background: #1e293b; color: #fff; }
    .canal.active { background: #e11d48; color: #fff; }
    .player-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .player-box { width: 100%; max-width: 960px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
    video, #player-iframe { width: 100%; display: block; background: #000; max-height: 70vh; border: none; }
    .status { margin-top: 12px; font-size: 0.85rem; color: #64748b; }
    .status.playing { color: #22c55e; }
    .status.error { color: #ef4444; }
    .info { color: #3b82f6; margin-top: 8px; font-size: 0.75rem; }
    .btns { margin-top: 10px; display: flex; gap: 8px; }
    .btns button {
      padding: 8px 16px; border: none; border-radius: 8px; background: #1e293b;
      color: #94a3b8; cursor: pointer; font-size: 0.8rem;
    }
    .btns button:hover { background: #334155; color: #fff; }
    .loading { text-align: center; padding: 40px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📺 TV Livre</h1>
    <span id="atualizado">Carregando...</span>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <input type="text" id="busca" placeholder="Buscar canal..." oninput="filtrar()">
      <div id="canais-lista"></div>
    </div>
    <div class="player-area" id="player-area">
      <div class="player-box">
        <video id="player" controls autoplay></video>
        <iframe id="player-iframe" style="display:none"></iframe>
      </div>
      <div class="status" id="status">📡 Selecione um canal</div>
      <div class="btns">
        <button onclick="togglePlay()">⏯ Play/Pause</button>
        <button onclick="toggleMute()">🔇 Mudo</button>
        <button onclick="fullscreen()">⛶ Tela cheia</button>
      </div>
    </div>
  </div>

  <script>
    let canais = [];
    let hls = null;
    let canalAtual = null;

    async function carregarCanais() {
      try {
        const resp = await fetch('canais.json?_=' + Date.now());
        canais = await resp.json();
        document.getElementById('atualizado').textContent = 
          '🔄 ' + new Date().toLocaleDateString('pt-BR');
        renderizar();
      } catch(e) {
        document.getElementById('canais-lista').innerHTML = 
          '<div class="loading">⚠️ Erro ao carregar canais</div>';
      }
    }

    function renderizar() {
      const container = document.getElementById('canais-lista');
      container.innerHTML = '';
      
      const grupos = {
        '📡 Canais': canais.filter(c => c.iframe),
        '⚙️ Direto': canais.filter(c => !c.iframe)
      };

      Object.entries(grupos).forEach(([nome, lista]) => {
        if (lista.length === 0) return;
        const titulo = document.createElement('div');
        titulo.className = 'grupo';
        titulo.textContent = nome;
        container.appendChild(titulo);
        
        lista.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'canal';
          btn.textContent = c.nome;
          btn.dataset.id = c.nome;
          btn.onclick = () => {
            document.querySelectorAll('.canal').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            tocar(c);
          };
          container.appendChild(btn);
        });
      });
    }

    function tocar(canal) {
      canalAtual = canal;
      const video = document.getElementById('player');
      const iframe = document.getElementById('player-iframe');
      const status = document.getElementById('status');

      if (hls) { hls.destroy(); hls = null; }
      video.style.display = 'none';
      iframe.style.display = 'none';
      video.src = '';

      if (canal.iframe) {
        status.className = 'status info';
        status.textContent = '▶ ' + canal.nome;
        iframe.style.display = 'block';
        iframe.src = canal.url;
        return;
      }

      video.style.display = 'block';
      status.className = 'status';
      status.textContent = '⏳ ' + canal.nome + '...';

      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = canal.url;
        status.textContent = '▶ ' + canal.nome;
      } else if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(canal.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          status.className = 'status playing';
          status.textContent = '▶ ' + canal.nome;
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, () => {
          status.className = 'status error';
          status.textContent = '❌ Erro em ' + canal.nome;
        });
      }
    }

    function filtrar() {
      const q = document.getElementById('busca').value.toLowerCase();
      document.querySelectorAll('.canal').forEach(btn => {
        btn.style.display = btn.textContent.toLowerCase().includes(q) ? 'block' : 'none';
      });
    }

    function togglePlay() {
      const v = document.getElementById('player');
      if (v.paused) v.play(); else v.pause();
    }
    function toggleMute() {
      const v = document.getElementById('player');
      v.muted = !v.muted;
    }
    function fullscreen() {
      const v = document.getElementById('player');
      v.requestFullscreen();
    }

    carregarCanais();
  </script>
</body>
</html>
